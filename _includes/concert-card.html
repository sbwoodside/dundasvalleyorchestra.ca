<li>
  {% if include.concert.poster %}
  <a href="{{ include.concert.url }}"><img src="{{ include.concert.poster }}" alt="{{ include.concert.title | escape }} concert poster"></a>
  {% endif %}
  <h2><a href="{{ include.concert.url }}">{{ include.concert.title }}</a></h2>
  <p>{{ include.concert.date | date: "%A, %B %-d, %Y" }}</p>
</li>
